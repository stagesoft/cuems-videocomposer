# SPDX-FileContributor: Ion Reguera <ion@stagelab.coop>
#
# This starter workflow is for a CMake project running on a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
#
# NOTE (869f8j1ja, 2026-09-29): this workflow never actually ran — every
# queued job sat for 24h and was auto-cancelled, because `runs-on:
# debian-bookworm` names a self-hosted runner label with zero runners
# registered for this repo. It also only triggered on `main`, which is 19
# commits behind `rc_1` (the branch every PR actually targets) and never
# received a push. Fixed: a GitHub-hosted runner (ubuntu-latest, same as
# rtpmidid/ola elsewhere in this org) and both branches. Submodules are
# now checked out too — mtcreceiver, cuemslogger and cuems-mediadecoder
# are required just to configure, and were previously missing entirely.

name: CMake on a single platform

on:
  push:
    branches: [ "main", "rc_1" ]
  pull_request:
    branches: [ "main", "rc_1" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libavformat-dev \
          libavcodec-dev \
          libavutil-dev \
          libswscale-dev \
          libx11-dev \
          libxpm-dev \
          libgl1-mesa-dev \
          libglew-dev \
          libegl-dev \
          libva-dev \
          libdrm-dev \
          libwayland-dev \
          wayland-protocols \
          libxinerama-dev \
          libxv-dev \
          libimlib2-dev \
          libfreetype6-dev \
          liblo-dev \
          libltc-dev \
          libasound2-dev \
          libsnappy-dev

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j"$(nproc)"

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
